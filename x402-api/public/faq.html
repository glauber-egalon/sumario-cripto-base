    <h3>O que é x402?</h3>
    <p>
      É um protocolo para pagamentos por requisição HTTP.
    </p>

    <h3>Qual rede é utilizada?</h3>
    <p>
      Base Mainnet.
    </p>

    <h3>Qual token é usado para pagamento?</h3>
    <p>
      USDC.
    </p>

    <h3>O pagamento é reembolsável?</h3>
    <p>
      Não. O pagamento libera o conteúdo solicitado.
    </p>
